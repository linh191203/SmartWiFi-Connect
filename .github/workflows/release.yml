name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

jobs:
  validate-release:
    name: Validate Release Configuration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Validate environment variables
        run: |
          if [ -z "${{ secrets.PRODUCTION_API_BASE_URL }}" ]; then
            echo "❌ PRODUCTION_API_BASE_URL secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.PRODUCTION_API_AUTH_TOKEN }}" ]; then
            echo "❌ PRODUCTION_API_AUTH_TOKEN secret not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: validate-release

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          PRODUCTION_API_AUTH_TOKEN: ${{ secrets.PRODUCTION_API_AUTH_TOKEN }}

      - name: Verify APK integrity
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK built successfully: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK not found at expected location"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ needs.validate-release.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: ${{ contains(needs.validate-release.outputs.version, 'beta') || contains(needs.validate-release.outputs.version, 'alpha') }}
          body: |
            ## SmartWiFi-Connect Release ${{ needs.validate-release.outputs.version }}
            
            ### Changes
            - Production build with optimizations
            - All tests passing
            - Ready for deployment
            
            ### Installation
            Download and install the APK on your Android device.
            
            ### Minimum Requirements
            - Android 10 (API 29) or higher
            - 100 MB free storage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: build-release
    if: always()
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.build-release.result }}" = "success" ]; then
            echo "✅ Release build completed successfully"
            echo "📦 APK is ready for distribution"
          else
            echo "❌ Release build failed"
            exit 1
          fi
